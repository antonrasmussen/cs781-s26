# Base experiment config. Compose with dataset, model, precision, prompt, calibration.
seed: 42
artifact_root: "artifacts/runs"
evaluation:
  # Declared metric names for documentation/sweeps. run_single always computes
  # accuracy, macro_f1, per_class_f1, and ECE (ece_bins); ACE is recomputed in
  # experiments/build_final_report.py. reliability_diagram is always written.
  metrics: [macro_f1, per_class_f1, accuracy, ece]
  ece_bins: 15
  reliability_diagram: true
hardware:
  device_map: "auto"
  batch_size: 1
